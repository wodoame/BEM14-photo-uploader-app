<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #1a1a2e;
            color: #fff;
            padding: 1.25rem 2rem;
        }
        header h1 { font-size: 1.5rem; font-weight: 600; }

        main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }

        /* Upload form */
        .upload-card {
            background: #fff;
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            margin-bottom: 2.5rem;
        }
        .upload-card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #444; }
        .upload-form { display: flex; gap: .75rem; flex-wrap: wrap; align-items: flex-end; }
        .upload-form input[type="file"] {
            flex: 1 1 220px;
            padding: .5rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fafafa;
            cursor: pointer;
        }
        .upload-form input[type="text"] {
            flex: 2 1 280px;
            padding: .55rem .75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: .95rem;
        }
        .upload-form button {
            padding: .55rem 1.4rem;
            background: #1a1a2e;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: .95rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .upload-form button:hover { background: #2e2e5e; }

        /* Gallery grid */
        .gallery-heading { font-size: 1.1rem; color: #444; margin-bottom: 1rem; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.25rem;
        }
        .photo-card {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            transition: transform .15s;
        }
        .photo-card:hover { transform: translateY(-3px); }
        .photo-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            display: block;
        }
        .photo-card .caption {
            padding: .65rem .85rem;
            font-size: .88rem;
            color: #555;
            min-height: 2.5rem;
        }

        .empty { text-align: center; color: #888; padding: 3rem 0; font-size: 1rem; }
    </style>
</head>
<body>

<header>
    <h1>Photo Gallery</h1>
</header>

<main>
    <div class="upload-card">
        <h2>Upload a Photo</h2>
        <form class="upload-form" action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="photo" accept="image/*" required>
            <input type="text" name="description" placeholder="Add a description…" maxlength="500">
            <button type="submit">Upload</button>
        </form>
    </div>

    <p class="gallery-heading" th:if="${!photos.isEmpty()}">
        <span th:text="${photos.size()}"></span> photo(s)
    </p>

    <div class="gallery" th:if="${!photos.isEmpty()}">
        <div class="photo-card" th:each="photo : ${photos}">
            <img th:src="${'https://' + cfDomain + '/' + photo.s3Key}"
                 th:alt="${photo.description}"
                 loading="lazy">
            <div class="caption" th:text="${photo.description}"></div>
        </div>
    </div>

    <p class="empty" th:if="${photos.isEmpty()}">No photos yet. Upload one above!</p>
</main>

</body>
</html>
