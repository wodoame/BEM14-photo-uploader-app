<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #1a1a2e;
            color: #fff;
            padding: 1.25rem 2rem;
        }
        header h1 { font-size: 1.5rem; font-weight: 600; }

        main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }

        /* Upload form */
        .upload-card {
            background: #fff;
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            margin-bottom: 2.5rem;
            max-width: 540px;
            margin-left: auto;
            margin-right: auto;
        }
        .upload-card h2 { font-size: 1.1rem; margin-bottom: 1.25rem; color: #444; }
        .upload-form { display: flex; flex-direction: column; gap: 1rem; }

        .dropzone {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: border-color .2s, background .2s;
            background: #fafafa;
            position: relative;
        }
        .dropzone:hover, .dropzone.drag-over {
            border-color: #1a1a2e;
            background: #f0f0f8;
        }
        .dropzone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }
.dropzone-label { font-size: .95rem; color: #666; }
        .dropzone-label span { color: #1a1a2e; font-weight: 600; }
        .dropzone-hint { font-size: .8rem; color: #aaa; margin-top: .25rem; }

        .dropzone-preview {
            display: none;
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 6px;
            margin-bottom: .5rem;
        }
        .dropzone-filename { font-size: .85rem; color: #555; }

        .upload-form textarea {
            width: 100%;
            padding: .65rem .75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: .95rem;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
        }
        .upload-form textarea:focus { outline: none; border-color: #1a1a2e; }

        .upload-form button {
            padding: .6rem 1.4rem;
            background: #1a1a2e;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: .95rem;
            cursor: pointer;
            width: 100%;
        }
        .upload-form button:hover { background: #2e2e5e; }

        /* Gallery grid */
        .gallery-heading { font-size: 1.1rem; color: #444; margin-bottom: 1rem; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.25rem;
        }
        .photo-card {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            transition: transform .15s;
        }
        .photo-card:hover { transform: translateY(-3px); }
        .photo-card img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            display: block;
        }
        .photo-card .caption {
            padding: .65rem .85rem;
            font-size: .88rem;
            color: #555;
            min-height: 2.5rem;
        }

        .empty { text-align: center; color: #888; padding: 3rem 0; font-size: 1rem; }
    </style>
</head>
<body>

<header>
    <h1>Photo Gallery</h1>
</header>

<main>
    <div class="upload-card">
        <h2>Upload a Photo</h2>
        <form class="upload-form" action="/upload" method="post" enctype="multipart/form-data">
            <div class="dropzone" id="dropzone">
                <input type="file" name="photo" accept="image/*" required id="fileInput">
                <img class="dropzone-preview" id="preview" alt="Preview">
                <div id="dropzoneContent">
                    <div class="dropzone-label"><span>Click to choose</span> or drag &amp; drop</div>
                    <div class="dropzone-hint">PNG, JPG, WEBP up to 10 MB</div>
                </div>
                <div class="dropzone-filename" id="filename"></div>
            </div>
            <textarea name="description" placeholder="Add a description…" maxlength="500"></textarea>
            <button type="submit">Upload</button>
        </form>
    </div>

    <p class="gallery-heading" th:if="${!photos.isEmpty()}">
        <span th:text="${photos.size()}"></span> photo(s)
    </p>

    <div class="gallery" th:if="${!photos.isEmpty()}">
        <div class="photo-card" th:each="photo : ${photos}">
            <img th:src="${'https://' + cfDomain + '/' + photo.s3Key}"
                 th:alt="${photo.description}"
                 loading="lazy">
            <div class="caption" th:text="${photo.description}"></div>
        </div>
    </div>

    <p class="empty" th:if="${photos.isEmpty()}">No photos yet. Upload one above!</p>
</main>

<script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const preview  = document.getElementById('preview');
    const content  = document.getElementById('dropzoneContent');
    const filename = document.getElementById('filename');

    function showPreview(file) {
        if (!file) return;
        const url = URL.createObjectURL(file);
        preview.src = url;
        preview.style.display = 'block';
        content.style.display = 'none';
        filename.textContent = file.name;
    }

    fileInput.addEventListener('change', () => showPreview(fileInput.files[0]));

    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
    dropzone.addEventListener('drop', e => {
        e.preventDefault();
        dropzone.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) {
            const dt = new DataTransfer();
            dt.items.add(file);
            fileInput.files = dt.files;
            showPreview(file);
        }
    });
</script>
</body>
</html>
