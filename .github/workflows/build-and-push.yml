name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:latest .
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Populate taskdef.json
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN }}
          EXEC_ROLE: ${{ secrets.ECS_TASK_EXECUTION_ROLE_ARN }}
          TASK_ROLE: ${{ secrets.ECS_TASK_ROLE_ARN }}
          DB_SECRET_ARN: ${{ secrets.DB_SECRET_ARN }}
        run: |
          sed -i \
            -e "s|<ECS_TASK_EXECUTION_ROLE_ARN>|$EXEC_ROLE|g" \
            -e "s|<ECS_TASK_ROLE_ARN>|$TASK_ROLE|g" \
            -e "s|<DB_HOST>|$DB_HOST|g" \
            -e "s|<DB_PORT>|$DB_PORT|g" \
            -e "s|<DB_NAME>|$DB_NAME|g" \
            -e "s|<S3_BUCKET>|$S3_BUCKET|g" \
            -e "s|<CLOUDFRONT_DOMAIN>|$CLOUDFRONT_DOMAIN|g" \
            -e "s|<DB_SECRET_ARN>|$DB_SECRET_ARN|g" \
            -e "s|<AWS_REGION>|$AWS_REGION|g" \
            deploy/taskdef.json

      - name: Package and upload deploy bundle
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET_NAME }}
        run: |
          cd deploy
          zip -r deploy-bundle.zip appspec.yaml taskdef.json
          aws s3 cp deploy-bundle.zip s3://$ARTIFACT_BUCKET/deploy/deploy-bundle.zip
